services:
  api:
    build: .
    image: museum-light-budget:latest
    container_name: museum-light-budget
    ports:
      - "8000:8000"
    environment:
      LUX_DB_PATH: /data/museum.db
      # Set to true to preload the demo showcase/exhibit from the README.
      LUX_SEED_SAMPLE: "true"
    volumes:
      - museum-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  museum-data:
